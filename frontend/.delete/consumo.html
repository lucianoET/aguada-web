<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Consumo</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .top-bar {
    background:white; border-radius:10px; padding:14px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px;
    display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;
  }
  .top-bar label { font-size:var(--font-xs); font-weight:600; color:var(--text-muted); margin-bottom:3px; }
  .top-bar input, .top-bar button { width:auto; font-size:var(--font-sm); }
  .alias-selector { display:flex; gap:6px; flex-wrap:wrap; }
  .alias-btn {
    padding:5px 12px; border-radius:20px; border:1px solid var(--border-color);
    cursor:pointer; font-size:var(--font-xs); background:white; font-weight:500;
  }
  .alias-btn.active { background:var(--accent-purple); color:white; border-color:var(--accent-purple); }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .stat-card { background:white; border-radius:10px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; }
  .stat-card .lbl { color:var(--text-muted); font-size:var(--font-xxs); text-transform:uppercase; font-weight:600; letter-spacing:.5px; }
  .stat-card .val { font-size:28px; font-weight:700; color:var(--primary-blue); margin:6px 0 2px; }
  .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:16px; }
  .chart-card { background:white; border-radius:10px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .chart-card h3 { color:#1e3a5f; font-size:var(--font-base); font-weight:600; margin-bottom:14px; }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="top-bar">
    <div><label>Data</label><input type="date" id="dateInput" style="width:150px;padding:7px 10px"></div>
    <div>
      <label>Reservatório</label>
      <div class="alias-selector" id="aliasSel"></div>
    </div>
    <button class="btn-primary" onclick="loadData()">Carregar</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="lbl">Consumido</div><div class="val" id="stConsumed">— L</div></div>
    <div class="stat-card"><div class="lbl">Abastecido</div><div class="val" id="stSupplied">— L</div></div>
    <div class="stat-card"><div class="lbl">Balanço</div><div class="val" id="stBalance">— L</div></div>
    <div class="stat-card"><div class="lbl">Eventos</div><div class="val" id="stEvents">—</div></div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <h3>📉 Volume ao longo do dia</h3>
      <canvas id="volChart" height="120"></canvas>
    </div>
    <div class="chart-card">
      <h3>📊 Eventos (consumo × abastecimento)</h3>
      <canvas id="evtChart" height="120"></canvas>
    </div>
  </div>
</div>

<script src="assets/vendor/chart.min.js"></script>
<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('consumo.html');

let volChart = null, evtChart = null;
let selAlias = null;

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

async function init() {
  document.getElementById('dateInput').value = aguadaAPI.today();
  try {
    const raw  = await aguadaAPI.getReservoirs();
    const data = aguadaAPI.sortReservoirs(raw);
    setStatus(data.some(r => r.online));
    const sel = document.getElementById('aliasSel');
    sel.innerHTML = data.map((r, i) =>
      `<button class="alias-btn${i===0?' active':''}" onclick="selectAlias('${r.alias}',this)">${r.alias}</button>`
    ).join('');
    selAlias = data[0]?.alias || null;
    if (selAlias) loadData();
  } catch(e) { setStatus(false); }
}

function selectAlias(alias, btn) {
  selAlias = alias;
  document.querySelectorAll('.alias-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function fmtHM(ts) {
  return new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

async function loadData() {
  const date = document.getElementById('dateInput').value;
  if (!selAlias || !date) return;
  try {
    const res = await aguadaAPI.getConsumption(selAlias, date);
    const s   = res.summary || {};
    document.getElementById('stConsumed').textContent = s.consumed_l != null ? s.consumed_l.toFixed(0)+' L' : '— L';
    document.getElementById('stSupplied').textContent = s.supplied_l != null ? s.supplied_l.toFixed(0)+' L' : '— L';
    const bal = s.balance_l ?? 0;
    const balEl = document.getElementById('stBalance');
    balEl.textContent  = (bal>=0?'+':'')+bal.toFixed(0)+' L';
    balEl.style.color  = bal >= 0 ? '#10b981' : '#ef4444';
    document.getElementById('stEvents').textContent = (res.events||[]).length;

    // Volume chart — histórico do dia
    const history  = await aguadaAPI.getHistory(selAlias, '24h');
    const todayTs  = new Date(date+'T00:00:00').getTime()/1000;
    const todayRows = history.filter(r => r.ts >= todayTs && r.ts < todayTs+86400);

    if (volChart) volChart.destroy();
    if (todayRows.length) {
      volChart = new Chart(document.getElementById('volChart'), {
        type:'line',
        data:{
          labels: todayRows.map(r => fmtHM(r.ts)),
          datasets:[{
            label:'Volume (L)', data:todayRows.map(r=>r.volume_l),
            borderColor:'#667eea', backgroundColor:'rgba(102,126,234,.1)',
            borderWidth:2, pointRadius:todayRows.length>200?0:2,
            tension:0.3, fill:true, spanGaps:true,
          }]
        },
        options:{responsive:true, plugins:{legend:{display:false}},
          scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}}}
      });
    }

    // Events chart
    const events = (res.events||[]).filter(e => e.type==='consumption'||e.type==='supply');
    if (evtChart) evtChart.destroy();
    if (events.length) {
      evtChart = new Chart(document.getElementById('evtChart'), {
        type:'bar',
        data:{
          labels: events.map(e => fmtHM(e.ts_start)),
          datasets:[{
            label:'Delta (L)', data:events.map(e=>e.delta_l),
            backgroundColor: events.map(e => e.type==='supply'?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)'),
          }]
        },
        options:{responsive:true, plugins:{legend:{display:false}},
          scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}}}
      });
    }
  } catch(e) {
    console.error(e);
    document.getElementById('stConsumed').textContent = 'Erro';
  }
}

init();
</script>
</body>
</html>
