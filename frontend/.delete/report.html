<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>AGUADA — Relatório</title>
  <link rel="stylesheet" href="assets/aguada.css?v=2">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="card" style="margin-bottom:16px;">
    <div class="card-header">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em">Central de Relatórios</div>
    </div>
    <div style="padding:16px;display:flex;flex-wrap:wrap;align-items:end;gap:16px;">
      <div>
        <label style="display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px;">Data</label>
        <input id="reportDate" type="date" class="form-input">
      </div>
      <a id="openDailyReport" class="btn btn-primary" href="relatorio_tabelas.html">Abrir Relatório Diário</a>
      <a id="downloadPdf" class="btn btn-secondary" href="/api/report/daily.pdf" download>Baixar PDF</a>
    </div>
  </div>

  <div class="card">
    <div style="padding:20px;display:flex;flex-direction:column;gap:10px;">
      <h2 style="margin:0;color:var(--text);font-size:var(--font-xl);">Relatório Diário</h2>
      <p style="margin:0;color:var(--text2);">Aqui ficam os acessos arquivados ao relatório diário em tabela e ao PDF consolidado.</p>
      <p style="margin:0;color:var(--text3);font-size:13px;">Use a data acima para abrir a visão tabular ou gerar o PDF correspondente.</p>
    </div>
  </div>
</div>

<script src="assets/api.js?v=20260418"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('report.html');

const reportDateInput = document.getElementById('reportDate');
const openDailyReport = document.getElementById('openDailyReport');
const downloadPdf = document.getElementById('downloadPdf');

function syncReportLinks() {
  const date = reportDateInput.value || aguadaAPI.today();
  openDailyReport.href = `relatorio_tabelas.html?date=${encodeURIComponent(date)}`;
  downloadPdf.href = `/api/report/daily.pdf?date=${encodeURIComponent(date)}`;
}

reportDateInput.value = aguadaAPI.today();
reportDateInput.addEventListener('change', syncReportLinks);
syncReportLinks();
</script>
</body>
</html>
