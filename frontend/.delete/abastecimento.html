<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Abastecimento</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .top-bar {
    background:white; border-radius:10px; padding:14px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px;
    display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;
  }
  .top-bar label { font-size:var(--font-xs); font-weight:600; color:var(--text-muted); margin-bottom:3px; }
  .top-bar input, .top-bar button { width:auto; font-size:var(--font-sm); }
  .supply-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .supply-card { background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .supply-card-header { padding:11px 16px; color:white; font-size:var(--font-sm); font-weight:600; }
  .supply-card-body { padding:14px; }
  .supply-kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
  .kpi { background:#f9fafb; border-radius:6px; padding:9px; text-align:center; }
  .kpi .k-lbl { font-size:var(--font-xxs); color:var(--text-muted); text-transform:uppercase; font-weight:600; letter-spacing:.4px; }
  .kpi .k-val { font-size:var(--font-lg); font-weight:700; color:#1e3a5f; margin-top:3px; }
  td, th { font-size:var(--font-xs); }
  .no-data { color:var(--text-muted); text-align:center; padding:16px; font-size:var(--font-sm); }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="top-bar">
    <div><label>Data</label><input type="date" id="dateInput" style="width:155px"></div>
    <button class="btn-primary" onclick="loadAll()">Carregar</button>
    <span style="font-size:var(--font-xs);color:var(--text-muted)" id="loadInfo"></span>
  </div>
  <div class="supply-grid" id="grid">
    <div style="color:var(--text-muted);padding:40px;font-size:var(--font-base)">⏳ Carregando...</div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('abastecimento.html');

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function fmtHM(ts) {
  return new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function cardHTML(r, consumption, idx) {
  const s       = consumption?.summary || {};
  const events  = (consumption?.events||[]).filter(e => e.type==='supply');
  const consumed = s.consumed_l ?? 0;
  const supplied = s.supplied_l ?? 0;
  const balance  = s.balance_l  ?? 0;
  const evtRows  = events.slice(0,6).map(e => `
    <tr>
      <td>${fmtHM(e.ts_start)}</td>
      <td style="color:#065f46;font-weight:600">+${e.delta_l.toFixed(0)} L</td>
      <td style="color:var(--text-muted)">${e.duration_min ? e.duration_min.toFixed(0)+'min' : '—'}</td>
    </tr>`).join('');

  return `
    <div class="supply-card">
      <div class="supply-card-header rc-${idx%8}">
        💧 ${r.alias}${r.name ? ' — '+r.name : ''}
      </div>
      <div class="supply-card-body">
        <div class="supply-kpi">
          <div class="kpi"><div class="k-lbl">Consumido</div><div class="k-val" style="color:#ef4444">${consumed.toFixed(0)} L</div></div>
          <div class="kpi"><div class="k-lbl">Abastecido</div><div class="k-val" style="color:#10b981">${supplied.toFixed(0)} L</div></div>
          <div class="kpi"><div class="k-lbl">Balanço</div><div class="k-val" style="color:${balance>=0?'#10b981':'#ef4444'}">${balance>=0?'+':''}${balance.toFixed(0)} L</div></div>
        </div>
        <div>
          ${events.length
            ? `<table>
                <thead><tr><th>Hora</th><th>Volume</th><th>Duração</th></tr></thead>
                <tbody>${evtRows}</tbody>
               </table>
               ${events.length>6?`<div style="font-size:var(--font-xxs);color:var(--text-muted);margin-top:5px">+${events.length-6} eventos...</div>`:''}`
            : '<div class="no-data">Sem eventos de abastecimento</div>'}
        </div>
      </div>
    </div>`;
}

async function loadAll() {
  const date = document.getElementById('dateInput').value;
  if (!date) return;
  document.getElementById('loadInfo').textContent = 'Carregando...';
  document.getElementById('grid').innerHTML = '<div style="color:var(--text-muted);padding:20px">⏳</div>';
  try {
    const raw        = await aguadaAPI.getReservoirs();
    const reservoirs = aguadaAPI.sortReservoirs(raw);
    setStatus(reservoirs.some(r => r.online));
    const results = await Promise.all(
      reservoirs.map(r => aguadaAPI.getConsumption(r.alias, date).catch(()=>null))
    );
    document.getElementById('grid').innerHTML = reservoirs.map((r,i) => cardHTML(r, results[i], i)).join('') || '<div style="color:var(--text-muted);padding:40px">Sem dados</div>';
    document.getElementById('loadInfo').textContent = `${reservoirs.length} reservatórios`;
  } catch(e) {
    setStatus(false);
    document.getElementById('grid').innerHTML = `<div class="alert">Erro: ${e.message}</div>`;
    document.getElementById('loadInfo').textContent = '';
  }
}

document.getElementById('dateInput').value = aguadaAPI.today();
loadAll();
</script>
</body>
</html>
