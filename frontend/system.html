<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Sistema</title>
<link rel="stylesheet" href="assets/aguada.css?v=2">
<link rel="stylesheet" href="assets/style.css">
<style>
  .sys-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .sys-card { background:var(--card, white); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden; }
  .sys-card-header { padding:12px 18px; color:white; font-size:var(--font-sm); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .sys-card-body { padding:14px 18px; }
  .frow { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border, #f3f4f6); font-size:var(--font-sm); }
  .frow:last-child { border-bottom:none; }
  .frow .lbl { font-size:var(--font-xxs); color:var(--text-muted, var(--text3)); text-transform:uppercase; font-weight:600; letter-spacing:.4px; }
  .frow .val { font-weight:600; color:var(--text, #1e3a5f); font-size:var(--font-sm); }
  .tag-online  { background:var(--green-dim, #d1fae5); color:var(--green, #065f46); padding:2px 8px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; }
  .tag-offline { background:var(--red-dim, #fee2e2); color:var(--red, #991b1b); padding:2px 8px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; }
  .tag-sim     { background:var(--yellow-dim, #fef3c7); color:var(--yellow, #92400e); padding:2px 8px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="tab-bar">
    <a href="manutencao.html" class="tab-btn" style="text-decoration:none">Manutenção</a>
    <button class="tab-btn active">Sistema</button>
  </div>
  <div class="sys-grid" id="sysGrid"><div class="loader"></div></div>
</div>

<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('manutencao.html');

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function frow(lbl, val) {
  return `<div class="frow"><span class="lbl">${lbl}</span><span class="val">${val}</span></div>`;
}

function gatewayCard(gw) {
  const tag = gw.sim_mode
    ? '<span class="tag-sim">● Simulação</span>'
    : gw.connected ? '<span class="tag-online">● Conectado</span>' : '<span class="tag-offline">● Desconectado</span>';
  return `
    <div class="sys-card">
      <div class="sys-card-header" style="background:linear-gradient(135deg,#667eea,#764ba2)">
        <span>⚡ Gateway</span>${tag}
      </div>
      <div class="sys-card-body">
        ${frow('Conectado', gw.connected ? 'Sim' : 'Não')}
        ${frow('Modo', gw.sim_mode ? 'Simulação' : 'Real')}
        ${frow('Porta', gw.port||'—')}
        ${frow('MAC', gw.mac ? `<code style="font-size:var(--font-xs)">${gw.mac}</code>` : '—')}
        ${frow('Firmware', gw.fw||'—')}
        ${frow('Último pacote', aguadaAPI.fmtTs(gw.last_seen))}
      </div>
    </div>`;
}

function backendCard() {
  return `
    <div class="sys-card">
      <div class="sys-card-header" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">
        <span>🖥️ Backend</span><span class="tag-online">● Online</span>
      </div>
      <div class="sys-card-body">
        ${frow('URL', location.origin)}
        ${frow('Protocolo', location.protocol.replace(':',''))}
        ${frow('Hora do cliente', new Date().toLocaleString('pt-BR'))}
      </div>
    </div>`;
}

function nodesCard(nodes) {
  if (!nodes?.length) return `
    <div class="sys-card">
      <div class="sys-card-header" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
        <span>📡 Nodes</span><span style="font-size:var(--font-xs);opacity:.8">0 nodes</span>
      </div>
      <div class="sys-card-body"><div style="text-align:center;color:var(--text-muted);padding:20px;font-size:var(--font-sm)">Nenhum node encontrado</div></div>
    </div>`;

  const rows = nodes.map(n => `<tr>
    <td><code style="font-size:var(--font-xxs)">${n.node_id||'—'}</code></td>
    <td>${n.alias||'—'}</td>
    <td>${n.name||'—'}</td>
    <td>${n.online?'<span class="tag-online">Online</span>':'<span class="tag-offline">Offline</span>'}</td>
    <td>${n.rssi!=null?n.rssi+' dBm':'—'}</td>
    <td>${aguadaAPI.fmtTs(n.last_seen)}</td>
  </tr>`).join('');

  return `
    <div class="sys-card" style="grid-column:1/-1">
      <div class="sys-card-header" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
        <span>📡 Nodes (${nodes.length})</span>
        <span style="font-size:var(--font-xs);opacity:.8">${nodes.filter(n=>n.online).length} online</span>
      </div>
      <div class="sys-card-body">
        <table>
          <thead><tr><th>Node ID</th><th>Alias</th><th>Nome</th><th>Status</th><th>RSSI</th><th>Último sinal</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

async function load() {
  try {
    const [gw, nodes] = await Promise.all([
      aguadaAPI.getGateway().catch(()=>null),
      aguadaAPI.getNodes().catch(()=>[]),
    ]);
    setStatus(true);
    document.getElementById('sysGrid').innerHTML = (gw ? gatewayCard(gw) : '') + backendCard() + nodesCard(nodes);
  } catch(e) {
    setStatus(false);
    document.getElementById('sysGrid').innerHTML = `<div class="alert">Erro: ${e.message}</div>`;
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
