<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=painel.html">
<link rel="icon" href="data:,">
<title>AGUADA — Dashboard</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .dash-layout {
    display: grid;
    grid-template-columns: 1.8fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 1200px) {
    .dash-layout { grid-template-columns: 1fr; }
    .cards-col { display: grid !important; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); max-height: none !important; }
  }
  .diagram-box {
    background: white; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 24px;
  }
  .diagram-box h2 {
    margin: 0 0 16px; font-size: var(--font-lg); font-weight: 600; color: #1e3a5f;
  }
  .hydraulic-diagram {
    position: relative; height: 580px;
    background: linear-gradient(to bottom,#e8f4f8,#d0e8f0);
    border-radius: 8px; border: 2px solid #b0d4e8; overflow: hidden;
  }
  .res-vis {
    position: absolute; text-align: center; cursor: pointer;
    transition: all .3s ease; z-index: 5; user-select: none;
  }
  .res-vis:hover { transform: scale(1.08); z-index: 10; filter: drop-shadow(0 4px 12px rgba(0,0,0,.2)); }
  .res-vis-tank {
    width: 90px; height: 130px;
    background: linear-gradient(to bottom,#1e3a5f,#2d4a6f);
    border: 3px solid #1e3a5f; border-radius: 8px;
    position: relative; overflow: hidden; margin: 0 auto;
    box-shadow: 0 4px 8px rgba(0,0,0,.15);
  }
  .res-vis-level {
    position: absolute; bottom:0; left:0; right:0;
    transition: height .6s ease, background .6s ease;
    border-radius: 0 0 5px 5px;
  }
  .res-vis-label { margin-top: 6px; font-weight: 600; font-size: var(--font-xxs); color: #1e3a5f; }
  .res-vis-pct   { font-size: var(--font-sm); font-weight: 700; margin-top: 2px; }
  .res-vis-vol   { font-size: var(--font-xxs); color: #6b7280; }
  .pipe { position: absolute; background: #5a7a9a; z-index: 1; opacity: .6; }
  .pipe-h { height: 4px; }
  .pipe-v { width: 4px; }
  .cards-col {
    display: flex; flex-direction: column; gap: 12px;
    max-height: 630px; overflow-y: auto; padding-right: 4px;
  }
  .cards-col::-webkit-scrollbar { width: 4px; }
  .cards-col::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 2px; }
  .stats-bar {
    background: white; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 18px 24px;
    display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 20px;
  }
  .stat-item { text-align: center; padding: 10px; background: #f9fafb; border-radius: 8px; }
  .stat-item-val { font-size: 26px; font-weight: 700; color: #1e3a5f; margin-bottom: 4px; }
  .stat-item-lbl { font-size: var(--font-xxs); color: #6b7280; text-transform: uppercase; font-weight: 600; letter-spacing: .8px; }
  /* res-card overrides for this page */
  .res-card-body .res-data-label { font-size: var(--font-xxs); }
  .res-card-body .res-data-value { font-size: var(--font-sm); }
  .res-vol-pct { font-size: 32px; }
  .res-vol-l   { font-size: var(--font-sm); }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="dash-layout">
    <div class="diagram-box">
      <h2>📊 Diagrama Hidráulico</h2>
      <div class="hydraulic-diagram" id="diagram">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7280;font-size:var(--font-base);">⏳ Carregando...</div>
      </div>
    </div>
    <div class="cards-col" id="cardsCol">
      <div style="color:#6b7280;text-align:center;padding:40px;font-size:var(--font-base);">⏳ Carregando...</div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-item-val" id="stOnline">—</div><div class="stat-item-lbl">Sensores Online</div></div>
    <div class="stat-item"><div class="stat-item-val" id="stVol">—</div><div class="stat-item-lbl">Volume Total (m³)</div></div>
    <div class="stat-item"><div class="stat-item-val" id="stPct">—</div><div class="stat-item-lbl">Nível Médio</div></div>
    <div class="stat-item"><div class="stat-item-val" id="stSync">—</div><div class="stat-item-lbl">Última Atualização</div></div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('index.html');

// Posições no diagrama: 2 linhas × 4 colunas
const POS = [
  {top:'40px', left:'55px'}, {top:'40px', left:'215px'},
  {top:'40px', left:'375px'},{top:'40px', left:'535px'},
  {top:'290px',left:'55px'}, {top:'290px',left:'215px'},
  {top:'290px',left:'375px'},{top:'290px',left:'535px'},
];

let reservoirs = [];

function gc(pct) {
  if (pct <= 20) return '#ef4444';
  if (pct <= 35) return '#f59e0b';
  return '#10b981';
}

function renderDiagram(data) {
  const el = document.getElementById('diagram');
  if (!data.length) { el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7280;">Sem dados</div>'; return; }
  let html = '';
  const n = Math.min(data.length, 4);
  for (let i = 0; i < n - 1; i++)
    html += `<div class="pipe pipe-h" style="top:108px;left:${140+i*160}px;width:80px"></div>`;
  if (data.length > 4) {
    const n2 = Math.min(data.length - 4, 4);
    for (let i = 0; i < n2 - 1; i++)
      html += `<div class="pipe pipe-h" style="top:358px;left:${140+i*160}px;width:80px"></div>`;
    html += `<div class="pipe pipe-v" style="top:108px;left:98px;height:254px"></div>`;
  }
  data.forEach((r, i) => {
    const pos = POS[i] || {top:`${40+Math.floor(i/4)*250}px`, left:`${55+(i%4)*160}px`};
    const pct = r.pct ?? 0, col = gc(pct);
    const vol = r.volume_l != null ? (r.volume_l/1000).toFixed(1) : '—';
    html += `
      <div class="res-vis" style="top:${pos.top};left:${pos.left}" data-alias="${r.alias}" onclick="highlightCard('${r.alias}')">
        <div class="res-vis-tank">
          <div class="res-vis-level" style="height:${pct}%;background:linear-gradient(to top,${col},${col}88)"></div>
        </div>
        <div class="res-vis-label">${r.alias}</div>
        <div class="res-vis-pct" style="color:${col}">${pct.toFixed(1)}%</div>
        <div class="res-vis-vol">${vol} m³</div>
      </div>`;
  });
  el.innerHTML = html;
}

function renderCards(data) {
  const col = document.getElementById('cardsCol');
  if (!data.length) { col.innerHTML = '<div style="color:#6b7280;text-align:center;padding:40px;">Sem reservatórios</div>'; return; }
  col.innerHTML = data.map((r, i) => {
    const pct = r.pct ?? 0, col_ = gc(pct);
    const vol = r.volume_l != null ? (r.volume_l/1000).toFixed(2) : '—';
    const cap = r.volume_max_l != null ? (r.volume_max_l/1000).toFixed(1) : (r.capacity_l != null ? (r.capacity_l/1000).toFixed(1) : '—');
    return `
      <div class="res-card" id="card-${r.alias}" data-alias="${r.alias}" onclick="highlightDiagram('${r.alias}')" style="cursor:pointer">
        <div class="res-card-header rc-${i%8}">
          <span>${r.alias}${r.name ? ' — '+r.name : ''}</span>
          <span class="res-card-status">${r.online ? '● Online' : '● Offline'}</span>
        </div>
        <div class="res-card-body">
          <div style="text-align:center;margin-bottom:10px">
            <div class="res-vol-pct" style="color:${col_}">${pct.toFixed(1)}%</div>
            <div class="res-vol-l">${vol} m³ / ${cap} m³</div>
            <div class="res-gauge"><div class="res-gauge-fill" style="width:${pct}%;background:${col_}"></div></div>
          </div>
          <div class="res-data-grid">
            <div class="res-data-cell"><div class="res-data-label">Nível</div><div class="res-data-value">${r.level_cm != null ? r.level_cm.toFixed(1)+' cm' : '—'}</div></div>
            <div class="res-data-cell"><div class="res-data-label">RSSI</div><div class="res-data-value">${r.rssi != null ? r.rssi+' dBm' : '—'}</div></div>
            <div class="res-data-cell" style="grid-column:1/-1"><div class="res-data-label">Atualizado</div><div class="res-data-value" style="font-size:var(--font-xs);font-weight:400">${aguadaAPI.fmtTs(r.ts)}</div></div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderStats(data) {
  const online = data.filter(r => r.online).length;
  const totalVol = data.reduce((s,r) => s+(r.volume_l||0), 0);
  const avgPct   = data.length ? data.reduce((s,r) => s+(r.pct||0), 0)/data.length : 0;
  document.getElementById('stOnline').textContent = `${online}/${data.length}`;
  document.getElementById('stVol').textContent    = (totalVol/1000).toFixed(1);
  document.getElementById('stPct').textContent    = avgPct.toFixed(1)+'%';
  document.getElementById('stSync').textContent   = new Date().toLocaleTimeString('pt-BR');
}

function setStatus(online) {
  document.getElementById('statusDot').className  = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function highlightCard(alias) {
  document.querySelectorAll('.res-card').forEach(c => c.style.outline = '');
  const card = document.getElementById('card-'+alias);
  if (card) { card.style.outline = '2px solid #667eea'; card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

function highlightDiagram(alias) {
  document.querySelectorAll('.res-vis').forEach(v => { v.style.opacity='0.5'; v.style.transform='scale(1)'; });
  const vis = document.querySelector(`.res-vis[data-alias="${alias}"]`);
  if (vis) { vis.style.opacity='1'; vis.style.transform='scale(1.1)'; }
  document.querySelectorAll('.res-card').forEach(c => c.style.outline = '');
  const card = document.getElementById('card-'+alias);
  if (card) card.style.outline = '2px solid #667eea';
}

function updateFromData(raw) {
  if (!raw || !raw.length) return;
  reservoirs = aguadaAPI.sortReservoirs(raw);
  renderDiagram(reservoirs);
  renderCards(reservoirs);
  renderStats(reservoirs);
  setStatus(reservoirs.some(r => r.online));
}

async function load() {
  try {
    updateFromData(await aguadaAPI.getReservoirs());
  } catch(e) {
    setStatus(false);
    document.getElementById('cardsCol').innerHTML = `<div class="alert">Erro: ${e.message}</div>`;
  }
}

aguadaAPI.connectWS(msg => {
  if (msg.type === 'snapshot') {
    const data = Array.isArray(msg.data) ? msg.data : (msg.data?.reservoirs||[]);
    if (data.length) updateFromData(data);
  } else if (msg.type === 'reading' && msg.data?.alias) {
    const r = msg.data, idx = reservoirs.findIndex(x => x.alias===r.alias);
    if (idx >= 0) { reservoirs[idx]={...reservoirs[idx],...r}; renderDiagram(reservoirs); renderCards(reservoirs); renderStats(reservoirs); }
  }
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
