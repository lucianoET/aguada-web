<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Dados e Balanço</title>
<link rel="stylesheet" href="assets/aguada.css?v=2">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ── Atual ── */
  .tbl-wrap { background:var(--card, white); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden; }
  .tbl-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border-color, var(--border)); }
  .tbl-bar h2 { font-size:var(--font-lg); color:var(--text, #1e3a5f); font-weight:600; margin:0; }
  .tbl-info { font-size:var(--font-xs); color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .refresh-dot { width:7px; height:7px; border-radius:50%; background:var(--success-green); animation:pulse-dot 2s infinite; display:inline-block; }

  /* ── Filtros ── */
  .top-bar { background:var(--card, white); border-radius:10px; padding:10px 14px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:10px; display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .top-bar label { font-size:var(--font-xs); font-weight:600; color:var(--text-muted); margin-bottom:2px; display:block; }
  .alias-selector { display:flex; gap:5px; flex-wrap:wrap; }
  .alias-btn { padding:4px 10px; border-radius:20px; border:1px solid var(--border-color, var(--border)); cursor:pointer; font-size:var(--font-xs); background:var(--card, white); font-weight:500; color:var(--text-dark, var(--text)); transition:background .15s, color .15s, border-color .15s; }
  .alias-btn.active { background:var(--accent-purple, var(--blue)); color:white; border-color:var(--accent-purple, var(--blue)); }
  select, input[type="date"] { padding:5px 8px; border:1px solid var(--border-color, var(--border)); border-radius:6px; font-size:var(--font-sm); background:var(--bg2, white); color:var(--text-dark, var(--text)); }
  .date-filter { position:relative; min-width:148px; }
  .date-picker-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 10px; border:1px solid var(--border-color, var(--border)); border-radius:8px; background:var(--bg2, white); color:var(--text-dark, var(--text)); font-size:var(--font-sm); font-weight:500; }
  .date-picker-native { position:absolute; inset:20px 0 0 0; width:100%; height:calc(100% - 20px); opacity:0; cursor:pointer; }

  .tab-bar { margin-bottom:10px; padding:4px; }
  .tab-bar .tab-btn { padding:6px 12px; }

  /* ── Histórico ── */
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:8px; margin-bottom:10px; }
  .stat-mini { background:var(--card, white); border-radius:8px; padding:8px 10px; box-shadow:0 2px 6px rgba(0,0,0,.07); text-align:center; }
  .stat-mini .slbl { font-size:var(--font-xxs); color:var(--text-muted); text-transform:uppercase; font-weight:600; }
  .stat-mini .sval { font-size:17px; font-weight:700; color:var(--text, #1e3a5f); margin-top:2px; }
  .chart-wrap { background:var(--card, white); border-radius:10px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .chart-wrap h3 { color:var(--text, #1e3a5f); font-size:var(--font-base); font-weight:600; margin-bottom:8px; }

  /* ── Balanço Geral ── */
  .supply-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .supply-card { background:var(--card, white); border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .supply-card-header { padding:8px 12px; color:white; font-size:var(--font-sm); font-weight:600; }
  .supply-card-body { padding:10px; }
  .supply-kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
  .kpi { background:var(--bg3, #f9fafb); border-radius:6px; padding:7px; text-align:center; }
  .kpi .k-lbl { font-size:var(--font-xxs); color:var(--text-muted); text-transform:uppercase; font-weight:600; letter-spacing:.4px; }
  .kpi .k-val { font-size:14px; font-weight:700; color:var(--text, #1e3a5f); margin-top:2px; }
  .no-data { color:var(--text-muted); text-align:center; padding:16px; font-size:var(--font-sm); }

  /* ── Balanço Detalhe ── */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:10px; }
  .stat-card { background:var(--card, white); border-radius:10px; padding:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; }
  .stat-card .lbl { color:var(--text-muted); font-size:var(--font-xxs); text-transform:uppercase; font-weight:600; letter-spacing:.5px; }
  .stat-card .val { font-size:20px; font-weight:700; color:var(--blue, var(--primary-blue)); margin:4px 0 0; }
  .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:10px; }
  .chart-card { background:var(--card, white); border-radius:10px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .chart-card h3 { color:var(--text, #1e3a5f); font-size:var(--font-base); font-weight:600; margin-bottom:8px; }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="tab-bar">
    <button class="tab-btn active" id="tabAtual" onclick="switchTab('atual')">Leituras Atuais</button>
    <button class="tab-btn" id="tabHist" onclick="switchTab('hist')">Histórico Contínuo</button>
    <button class="tab-btn" id="tabGeral" onclick="switchTab('geral')">Balanço Diário (Geral)</button>
    <button class="tab-btn" id="tabDetalhe" onclick="switchTab('detalhe')">Balanço (Detalhe)</button>
  </div>

  <!-- ── ATUAL ── -->
  <div id="viewAtual">
    <div class="tbl-wrap">
      <div class="tbl-bar">
        <h2>📋 Leituras Atuais</h2>
        <div class="tbl-info"><span class="refresh-dot"></span>Atualiza 30s &nbsp;|&nbsp; <span id="lastUpdate">—</span></div>
      </div>
      <div id="tableContainer" style="padding:20px; overflow-x:auto;"><div class="loader"></div></div>
    </div>
  </div>

  <!-- ── HISTÓRICO ── -->
  <div id="viewHist" style="display:none">
    <div class="top-bar">
      <div>
        <label>Variável</label>
        <select id="varSel" onchange="loadHist()">
          <option value="pct">Nível %</option>
          <option value="volume_l">Volume (m³)</option>
          <option value="level_cm">Nível cm</option>
        </select>
      </div>
      <div>
        <label>Período</label>
        <select id="period" onchange="loadHist()">
          <option value="24h">Dia selecionado (00h-24h)</option>
          <option value="7d">7 dias</option>
          <option value="30d">30 dias</option>
        </select>
      </div>
      <div class="date-filter">
        <label>Data</label>
        <button type="button" class="date-picker-btn">
          <span>Calendário</span>
          <span id="histDateLabel">—</span>
        </button>
        <input type="date" id="dateHist" class="date-picker-native" onchange="syncHistDateLabel(); loadHist()">
      </div>
      <div>
        <label>Reservatório</label>
        <div class="alias-selector" id="aliasSelHist"></div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-mini"><div class="slbl">Mínimo</div><div class="sval" id="hMin">—</div></div>
      <div class="stat-mini"><div class="slbl">Máximo</div><div class="sval" id="hMax">—</div></div>
      <div class="stat-mini"><div class="slbl">Média</div><div class="sval" id="hAvg">—</div></div>
      <div class="stat-mini"><div class="slbl">Atual</div><div class="sval" id="hCur">—</div></div>
      <div class="stat-mini"><div class="slbl">Leituras</div><div class="sval" id="hCnt">—</div></div>
    </div>
    <div class="chart-wrap">
      <h3 id="chartTitleHist">📈 Histórico Contínuo</h3>
      <canvas id="histChart" height="100"></canvas>
    </div>
  </div>

  <!-- ── BALANÇO: VISÃO GERAL ── -->
  <div id="viewGeral" style="display:none">
    <div class="top-bar">
      <div><label>Data de Referência</label><input type="date" id="dateGeral" onchange="loadGeral()"></div>
      <button class="btn-primary" onclick="loadGeral()">Carregar Balanço Total</button>
      <span style="font-size:var(--font-xs);color:var(--text-muted);margin-bottom:6px" id="geralInfo"></span>
    </div>
    <div class="supply-grid" id="geralGrid">
      <div style="color:var(--text-muted);padding:40px;font-size:var(--font-base)">⏳ Carregando...</div>
    </div>
  </div>

  <!-- ── BALANÇO: DETALHE ── -->
  <div id="viewDetalhe" style="display:none">
    <div class="top-bar">
      <div><label>Data</label><input type="date" id="dateDetalhe" onchange="loadDetalhe()"></div>
      <div>
        <label>Reservatório</label>
        <div class="alias-selector" id="aliasSelDet"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="lbl">Consumido</div><div class="val" id="stConsumed">— m³</div></div>
      <div class="stat-card"><div class="lbl">Abastecido</div><div class="val" id="stSupplied">— m³</div></div>
      <div class="stat-card"><div class="lbl">Balanço (Net)</div><div class="val" id="stBalance">— m³</div></div>
      <div class="stat-card"><div class="lbl">Eventos Encontrados</div><div class="val" id="stEvents">—</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>📉 Curva de Volume (m³, 24h Selecionadas)</h3>
        <canvas id="volChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <h3>📊 Detalhamento de Eventos (Abastecimento x Consumo)</h3>
        <canvas id="evtChart" height="120"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/chart.min.js"></script>
<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('dados.html');

let globalReservoirs = [];
const ALL_ALIAS = 'ALL';
const DEFAULT_ALIAS = 'CON';
const LITERS_PER_M3 = 1000;

function switchTab(tab) {
  ['Atual','Hist','Geral','Detalhe'].forEach(t => {
    document.getElementById('view'+t).style.display = t.toLowerCase() === tab ? '' : 'none';
    document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase() === tab);
  });
  if ((tab === 'hist' || tab === 'detalhe') && !globalReservoirs.length) return;
  if (tab === 'hist') {
    initSels();
    loadHist();
  }
  if (tab === 'detalhe') {
    initSels();
    loadDetalhe();
  }
}

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function fmtHM(ts) {
  return new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtTs(ts) {
  const d = new Date(ts*1000);
  return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function litersToCubicMeters(value) {
  return value == null ? null : value / LITERS_PER_M3;
}

function metricUnit(metric) {
  if (metric === 'volume_l') return 'm³';
  if (metric === 'level_cm') return 'cm';
  return '%';
}

function metricLabel(metric) {
  if (metric === 'volume_l') return 'Volume (m³)';
  if (metric === 'level_cm') return 'Nível (cm)';
  return 'Nível %';
}

function metricValue(metric, value) {
  if (value == null) return null;
  return metric === 'volume_l' ? litersToCubicMeters(value) : value;
}

function formatMetric(metric, value, digits = 1) {
  const displayValue = metricValue(metric, value);
  if (displayValue == null) return '—';
  if (metric === 'pct') return `${displayValue.toFixed(digits)}%`;
  return `${displayValue.toFixed(digits)} ${metricUnit(metric)}`;
}

function formatVolumeM3(value, digits = 1) {
  return formatMetric('volume_l', value, digits);
}

// ── INIT SECONDS ──
async function preloadData() {
  try {
    const raw = await aguadaAPI.getReservoirs();
    globalReservoirs = aguadaAPI.sortReservoirs(raw);
    renderAtual(globalReservoirs);
    setStatus(raw.some(r => r.online));
    initSels();
    loadGeral();
    if (document.getElementById('viewHist').style.display !== 'none') loadHist();
    if (document.getElementById('viewDetalhe').style.display !== 'none') loadDetalhe();
  } catch(e) { /* ignore here, will be caught by individual loaders */ }
}

// ── LEITURAS ATUAIS ──
function gc(pct) {
  if (pct <= 20) return '#ef4444';
  if (pct <= 35) return '#f59e0b';
  return '#10b981';
}

function renderAtual(data) {
  const c = document.getElementById('tableContainer');
  if (!data.length) { c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">Nenhum reservatório.</div>'; return; }
  const rows = data.map(r => {
    const pct = r.pct ?? 0, col = gc(pct);
    const vol = formatVolumeM3(r.volume_l, 3);
    const cap = r.volume_max_l != null ? formatVolumeM3(r.volume_max_l, 1) : (r.capacity_l != null ? formatVolumeM3(r.capacity_l, 1) : '—');
    const badge = r.online ? '<span class="badge-online">● Online</span>' : '<span class="badge-offline">● Offline</span>';
    return `<tr>
      <td><strong style="color:#1e3a5f;font-size:var(--font-base)">${r.alias}</strong></td>
      <td style="color:var(--text-muted)">${r.name || '—'}</td>
      <td>${badge}</td>
      <td><div style="display:flex;align-items:center">
        <div class="pct-bar"><div class="pct-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <span style="font-weight:600;color:${col}">${pct.toFixed(1)}%</span>
      </div></td>
      <td>${vol}</td><td style="color:var(--text-muted)">${cap}</td>
      <td>${r.level_cm != null ? r.level_cm.toFixed(1)+' cm' : '—'}</td>
      <td>${r.rssi != null ? r.rssi+' dBm' : '—'}</td>
      <td style="color:var(--text-muted)">${aguadaAPI.fmtTs(r.ts)}</td>
    </tr>`;
  }).join('');
  c.innerHTML = `<table><thead><tr>
    <th>Alias</th><th>Nome</th><th>Status</th><th>Nível %</th>
    <th>Volume</th><th>Capacidade</th><th>Nível cm</th><th>RSSI</th><th>Atualização</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('pt-BR');
}

aguadaAPI.connectWS(msg => {
  if (msg.type === 'snapshot') {
    const data = Array.isArray(msg.data) ? msg.data : (msg.data?.reservoirs||[]);
    if (data.length) {
       globalReservoirs = aguadaAPI.sortReservoirs(data);
       renderAtual(globalReservoirs);
       setStatus(data.some(r=>r.online));
    }
  }
});

// ── SELECTORS (HIST & DETALHE) ──
let selAliasHist = null, selAliasDet = null;
const DAY_S = 86400;

function getDefaultAlias() {
  const con = globalReservoirs.find(r => r.alias === DEFAULT_ALIAS);
  return con ? con.alias : (globalReservoirs[0]?.alias || null);
}

function initSels() {
  if (!globalReservoirs.length) return;
  const defaultAlias = getDefaultAlias();
  const aliases = [{ alias: ALL_ALIAS, label: 'Todos' }, ...globalReservoirs.map(r => ({ alias: r.alias, label: r.alias }))];
  const genBtns = (currAlias, prefix) => aliases.map(item => 
    `<button class="alias-btn${(currAlias||defaultAlias)===item.alias?' active':''}" onclick="setSelAlias('${prefix}','${item.alias}',this)">${item.label}</button>`
  ).join('');

  document.getElementById('aliasSelHist').innerHTML = genBtns(selAliasHist, 'Hist');
  document.getElementById('aliasSelDet').innerHTML = genBtns(selAliasDet, 'Det');
  if(!selAliasHist) selAliasHist = defaultAlias;
  if(!selAliasDet) selAliasDet = defaultAlias;
}
function setSelAlias(prefix, alias, btn) {
  if(prefix==='Hist') selAliasHist = alias;
  if(prefix==='Det') selAliasDet = alias;
  btn.parentElement.querySelectorAll('.alias-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (prefix === 'Hist') loadHist();
  if (prefix === 'Det') loadDetalhe();
}

function startOfDayTs(dateStr) {
  return Math.floor(new Date(`${dateStr}T00:00:00`).getTime() / 1000);
}

function formatDateLabel(dateStr) {
  const [year, month, day] = dateStr.split('-');
  return `${day}/${month}/${year}`;
}

function syncHistDateLabel() {
  const date = document.getElementById('dateHist').value || aguadaAPI.today();
  document.getElementById('histDateLabel').textContent = formatDateLabel(date);
}

function getHistoryRange(period, dateStr) {
  const dayStart = startOfDayTs(dateStr);
  const dayEnd = dayStart + DAY_S;
  if (period === '24h') return { since_ts: dayStart, until_ts: dayEnd };
  if (period === '7d') return { since_ts: dayEnd - (7 * DAY_S), until_ts: dayEnd };
  return { since_ts: dayEnd - (30 * DAY_S), until_ts: dayEnd };
}

function buildHistoryLabel(ts, period) {
  const d = new Date(ts * 1000);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  if (period === '24h') return [`${hh}:${mi}`, `${dd}/${mm}`];
  const weekDay = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  return [weekDay, `${dd}/${mm}`];
}

function collapseHistoryRows(rows, period) {
  if (period === '24h') return rows;
  const byDay = new Map();
  rows.forEach(row => {
    const dayKey = new Date(row.ts * 1000).toISOString().slice(0, 10);
    const current = byDay.get(dayKey);
    if (!current || row.ts > current.ts) byDay.set(dayKey, row);
  });
  return Array.from(byDay.values()).sort((a, b) => a.ts - b.ts);
}

function periodLabel(period) {
  if (period === '24h') return '00h-24h';
  if (period === '7d') return '7 dias';
  return '30 dias';
}

function labelKey(label) {
  return Array.isArray(label) ? label.join(' | ') : String(label);
}

function buildCategoryChartData(seriesList) {
  const labelMap = new Map();
  seriesList.forEach(series => {
    series.points.forEach(point => {
      const key = labelKey(point.label);
      const existing = labelMap.get(key);
      if (!existing || point.ts < existing.ts) labelMap.set(key, { label: point.label, ts: point.ts });
    });
  });

  const orderedLabels = Array.from(labelMap.values())
    .sort((left, right) => left.ts - right.ts)
    .map(item => item.label);
  const labelIndex = new Map(orderedLabels.map((label, index) => [labelKey(label), index]));

  const datasets = seriesList.map(series => {
    const data = new Array(orderedLabels.length).fill(null);
    series.points.forEach(point => {
      const index = labelIndex.get(labelKey(point.label));
      if (index != null) data[index] = point.value;
    });
    return { ...series.dataset, data };
  }).filter(dataset => dataset.data.some(value => value != null));

  return { labels: orderedLabels, datasets };
}

// ── HISTÓRICO ──
let histChart = null;
async function loadHist() {
  if (!selAliasHist) return;
  const period = document.getElementById('period').value;
  const date = document.getElementById('dateHist').value || aguadaAPI.today();
  const varKey = document.getElementById('varSel').value;
  const range = getHistoryRange(period, date);
  try {
    const targets = selAliasHist === ALL_ALIAS ? globalReservoirs : globalReservoirs.filter(r => r.alias === selAliasHist);
    const histories = await Promise.all(targets.map(r => aguadaAPI.getHistory(r.alias, period, range).catch(() => [])));
    const merged = histories.flat().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const vals = merged.map(r => metricValue(varKey, r[varKey])).filter(v => v != null);
    document.getElementById('hMin').textContent = vals.length ? formatMetric(varKey, Math.min(...vals) * (varKey === 'volume_l' ? LITERS_PER_M3 : 1), 1) : '—';
    document.getElementById('hMax').textContent = vals.length ? formatMetric(varKey, Math.max(...vals) * (varKey === 'volume_l' ? LITERS_PER_M3 : 1), 1) : '—';
    document.getElementById('hAvg').textContent = vals.length ? formatMetric(varKey, (vals.reduce((a,b)=>a+b,0)/vals.length) * (varKey === 'volume_l' ? LITERS_PER_M3 : 1), 1) : '—';
    document.getElementById('hCur').textContent = vals.length ? formatMetric(varKey, vals[vals.length-1] * (varKey === 'volume_l' ? LITERS_PER_M3 : 1), 1) : '—';
    document.getElementById('hCnt').textContent = merged.length;
    document.getElementById('chartTitleHist').textContent = `📈 ${metricLabel(varKey)} — ${selAliasHist === ALL_ALIAS ? 'Todos os reservatórios' : selAliasHist} (${periodLabel(period)} em ${formatDateLabel(date)})`;
    if (histChart) histChart.destroy();
    const chartData = buildCategoryChartData(targets.map((reservoir, index) => {
      const history = collapseHistoryRows(histories[index] || [], period);
      const step = Math.max(1, Math.floor(history.length/300));
      const pts  = history.filter((_,i)=>i%step===0);
      const hue = (index * 47) % 360;
      return {
        dataset: {
          label: reservoir.alias,
          borderColor: `hsl(${hue} 72% 48%)`,
          backgroundColor: `hsl(${hue} 72% 48% / 0.08)`,
          borderWidth: 2,
          pointRadius: selAliasHist === ALL_ALIAS ? 0 : (pts.length>300?0:2),
          tension: 0.3,
          fill: false,
          spanGaps: true,
        },
        points: pts.map(r => ({ ts: r.ts, label: buildHistoryLabel(r.ts, period), value: metricValue(varKey, r[varKey]) })),
      };
    }));
    histChart = new Chart(document.getElementById('histChart'), {
      type:'line',
      data: chartData,
      options:{
        responsive:true,
        plugins:{legend:{display:selAliasHist === ALL_ALIAS, position:'bottom'}},
        scales:{
          x:{type:'category', ticks:{maxTicksLimit:12,font:{size:10}}, grid:{display:false}},
          y:{beginAtZero:true, min:0}
        }
      }
    });
  } catch(e) { console.error(e); }
}

// ── BALANÇO GERAL ──
function bCardHTML(r, consumption, idx) {
  const s       = consumption?.summary || {};
  const events  = (consumption?.events||[]).filter(e => e.type==='supply');
  const consumed = s.consumed_l ?? 0;
  const supplied = s.supplied_l ?? 0;
  const balance  = s.balance_l  ?? 0;
  const evtRows  = events.slice(0,6).map(e => `<tr><td>${fmtHM(e.ts_start)}</td><td style="color:#065f46;font-weight:600">+${formatVolumeM3(e.delta_l, 1)}</td><td style="color:var(--text-muted)">${e.duration_min ? e.duration_min.toFixed(0)+'m' : '—'}</td></tr>`).join('');
  return `
    <div class="supply-card">
      <div class="supply-card-header rc-${idx%8}">💧 ${r.alias}${r.name ? ' — '+r.name : ''}</div>
      <div class="supply-card-body">
        <div class="supply-kpi">
          <div class="kpi"><div class="k-lbl">Consumido</div><div class="k-val" style="color:#ef4444">${formatVolumeM3(consumed, 1)}</div></div>
          <div class="kpi"><div class="k-lbl">Abastecido</div><div class="k-val" style="color:#10b981">${formatVolumeM3(supplied, 1)}</div></div>
          <div class="kpi"><div class="k-lbl">Balanço</div><div class="k-val" style="color:${balance>=0?'#10b981':'#ef4444'}">${balance>=0?'+':''}${formatVolumeM3(Math.abs(balance), 1)}</div></div>
        </div>
        <div>
          ${events.length
            ? `<table><thead><tr><th>Início</th><th>Entrada.</th><th>Duração</th></tr></thead><tbody>${evtRows}</tbody></table>
               ${events.length>6?`<div style="font-size:var(--font-xxs);color:var(--text-muted);margin-top:5px">+${events.length-6} outros eventos...</div>`:''}`
            : '<div class="no-data">Nenhum abastecimento detectado nesta data</div>'}
        </div>
      </div>
    </div>`;
}

async function loadGeral() {
  const date = document.getElementById('dateGeral').value;
  if (!date || !globalReservoirs.length) return;
  document.getElementById('geralInfo').textContent = 'Analisando balanço diário...';
  document.getElementById('geralGrid').innerHTML = '<div style="color:var(--text-muted);padding:20px;font-size:16px;">⏳ Coletando deltas de fornecimento e consumo...</div>';
  try {
    const results = await Promise.all(
      globalReservoirs.map(r => aguadaAPI.getConsumption(r.alias, date).catch(()=>null))
    );
    document.getElementById('geralGrid').innerHTML = globalReservoirs.map((r,i) => bCardHTML(r, results[i], i)).join('') || '<div style="color:var(--text-muted);padding:40px">Sem dados de balanço</div>';
    document.getElementById('geralInfo').textContent = `${globalReservoirs.length} unidades processadas com sucesso.`;
  } catch(e) {
    document.getElementById('geralGrid').innerHTML = `<div class="alert">Erro na agregação de balanço: ${e.message}</div>`;
  }
}

// ── BALANÇO DETALHE ──
let volChart = null, evtChart = null;

async function loadDetalhe() {
  const date = document.getElementById('dateDetalhe').value;
  if (!selAliasDet || !date) return;
  try {
    const todayTs = startOfDayTs(date);
    const targets = selAliasDet === ALL_ALIAS ? globalReservoirs : globalReservoirs.filter(r => r.alias === selAliasDet);
    const [results, histories] = await Promise.all([
      Promise.all(targets.map(r => aguadaAPI.getConsumption(r.alias, date).catch(()=>({summary:{},events:[]})))),
      Promise.all(targets.map(r => aguadaAPI.getHistory(r.alias, '24h', { since_ts: todayTs, until_ts: todayTs + DAY_S }).catch(()=>[])))
    ]);
    const consumed = results.reduce((sum, res) => sum + (res.summary?.consumed_l ?? 0), 0);
    const supplied = results.reduce((sum, res) => sum + (res.summary?.supplied_l ?? 0), 0);
    const bal = results.reduce((sum, res) => sum + (res.summary?.balance_l ?? 0), 0);
    const eventCount = results.reduce((sum, res) => sum + ((res.events||[]).filter(event => event.type !== 'stable').length), 0);
    document.getElementById('stConsumed').textContent = formatVolumeM3(consumed, 1);
    document.getElementById('stSupplied').textContent = formatVolumeM3(supplied, 1);
    const balEl = document.getElementById('stBalance');
    balEl.textContent = (bal>=0?'+':'') + formatVolumeM3(Math.abs(bal), 1);
    balEl.style.color = bal >= 0 ? '#10b981' : '#ef4444';
    document.getElementById('stEvents').textContent = eventCount;

    if (volChart) volChart.destroy();
    const volChartData = buildCategoryChartData(targets.map((reservoir, index) => {
      const todayRows = (histories[index] || []).filter(r => r.volume_l != null);
      const hue = (index * 47) % 360;
      return {
        dataset: {
          label: reservoir.alias,
          borderColor: `hsl(${hue} 72% 48%)`,
          backgroundColor: `hsl(${hue} 72% 48% / 0.10)`,
          borderWidth: 2,
          pointRadius: selAliasDet === ALL_ALIAS ? 0 : (todayRows.length>200?0:2),
          tension: 0.3,
          fill: false,
          spanGaps: true,
        },
        points: todayRows.map(r => ({ ts: r.ts, label: fmtHM(r.ts), value: litersToCubicMeters(r.volume_l) })),
      };
    }));
    if (volChartData.datasets.length) {
      volChart = new Chart(document.getElementById('volChart'), {
        type:'line',
        data: volChartData,
        options:{responsive:true, plugins:{legend:{display:selAliasDet === ALL_ALIAS, position:'bottom'}}, scales:{x:{type:'category', ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}, y:{beginAtZero:true, min:0}}}
      });
    }

    if (evtChart) evtChart.destroy();
    if (selAliasDet === ALL_ALIAS) {
      const labels = targets.map(r => r.alias);
      const suppliedBars = results.map(res => res.summary?.supplied_l ?? 0);
      const consumedBars = results.map(res => res.summary?.consumed_l ?? 0);
      evtChart = new Chart(document.getElementById('evtChart'), {
        type:'bar',
        data:{ labels, datasets:[
          { label:'Abastecido (m³)', data:suppliedBars.map(litersToCubicMeters), backgroundColor:'rgba(16,185,129,.7)' },
          { label:'Consumido (m³)', data:consumedBars.map(litersToCubicMeters), backgroundColor:'rgba(239,68,68,.7)' }
        ] },
        options:{responsive:true, plugins:{legend:{display:true, position:'bottom'}}, scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}, y:{beginAtZero:true, min:0}}}
      });
    } else {
      const events = (results[0]?.events||[]).filter(e=>e.type==='consumption'||e.type==='supply');
      if (events.length) {
        evtChart = new Chart(document.getElementById('evtChart'), {
          type:'bar', data:{ labels: events.map(e=>fmtHM(e.ts_start)), datasets:[{ label:'Volume (m³)', data:events.map(e=>litersToCubicMeters(Math.abs(e.delta_l))), backgroundColor: events.map(e=>e.type==='supply'?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)') }] },
          options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}, y:{beginAtZero:true, min:0}}}
        });
      }
    }
  } catch(e) { console.error(e); }
}

const today = aguadaAPI.today();
document.getElementById('dateHist').value    = today;
document.getElementById('dateGeral').value   = today;
document.getElementById('dateDetalhe').value = today;
syncHistDateLabel();

preloadData();
setInterval(() => { if (!document.getElementById('viewAtual').style.display) preloadData(); }, 30000);
</script>
