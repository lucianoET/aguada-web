<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Dados e Balanço</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ── Tabs ── */
  .tab-bar { display:flex; gap:4px; margin-bottom:16px; background:white; border-radius:10px; padding:6px; box-shadow:0 2px 6px rgba(0,0,0,.07); flex-wrap:wrap; width:fit-content; }
  .tab-btn { padding:7px 18px; border-radius:7px; border:none; cursor:pointer; font-size:var(--font-sm); font-weight:500; background:transparent; color:var(--text-muted); transition:all .15s; }
  .tab-btn.active { background:var(--accent-purple); color:white; }

  /* ── Atual ── */
  .tbl-wrap { background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); overflow:hidden; }
  .tbl-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border-color); }
  .tbl-bar h2 { font-size:var(--font-lg); color:#1e3a5f; font-weight:600; margin:0; }
  .tbl-info { font-size:var(--font-xs); color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .refresh-dot { width:7px; height:7px; border-radius:50%; background:var(--success-green); animation:pulse 2s infinite; display:inline-block; }
  .badge-online  { background:#d1fae5; color:#065f46; padding:2px 8px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; }
  .badge-offline { background:#fee2e2; color:#991b1b; padding:2px 8px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; }
  .pct-bar { width:72px; height:7px; background:#e5e7eb; border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:5px; }
  .pct-bar-fill { height:100%; border-radius:4px; }
  td { font-size:var(--font-sm); padding:10px; border-bottom:1px solid var(--border-color); }
  th { font-size:var(--font-xxs); padding:10px; text-align:left; border-bottom:1px solid var(--border-color); }
  table { width:100%; border-collapse:collapse; }

  /* ── Componentes Compartilhados (Filtros) ── */
  .top-bar { background:white; border-radius:10px; padding:14px 20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .top-bar label { font-size:var(--font-xs); font-weight:600; color:var(--text-muted); margin-bottom:3px; display:block; }
  .alias-selector { display:flex; gap:6px; flex-wrap:wrap; }
  .alias-btn { padding:5px 12px; border-radius:20px; border:1px solid var(--border-color); cursor:pointer; font-size:var(--font-xs); background:white; font-weight:500; }
  .alias-btn.active { background:var(--accent-purple); color:white; border-color:var(--accent-purple); }
  select, input[type="date"] { padding:7px 10px; border:1px solid var(--border-color); border-radius:6px; font-size:var(--font-sm); }

  /* ── Histórico ── */
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
  .stat-mini { background:white; border-radius:8px; padding:12px 14px; box-shadow:0 2px 6px rgba(0,0,0,.07); text-align:center; }
  .stat-mini .slbl { font-size:var(--font-xxs); color:var(--text-muted); text-transform:uppercase; font-weight:600; }
  .stat-mini .sval { font-size:20px; font-weight:700; color:#1e3a5f; margin-top:4px; }
  .chart-wrap { background:white; border-radius:10px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .chart-wrap h3 { color:#1e3a5f; font-size:var(--font-base); font-weight:600; margin-bottom:14px; }

  /* ── Balanço Geral ── */
  .supply-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .supply-card { background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .supply-card-header { padding:11px 16px; color:white; font-size:var(--font-sm); font-weight:600; }
  .supply-card-body { padding:14px; }
  .supply-kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
  .kpi { background:#f9fafb; border-radius:6px; padding:9px; text-align:center; }
  .kpi .k-lbl { font-size:var(--font-xxs); color:var(--text-muted); text-transform:uppercase; font-weight:600; letter-spacing:.4px; }
  .kpi .k-val { font-size:16px; font-weight:700; color:#1e3a5f; margin-top:3px; }
  .no-data { color:var(--text-muted); text-align:center; padding:16px; font-size:var(--font-sm); }

  /* ── Balanço Detalhe ── */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat-card { background:white; border-radius:10px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; }
  .stat-card .lbl { color:var(--text-muted); font-size:var(--font-xxs); text-transform:uppercase; font-weight:600; letter-spacing:.5px; }
  .stat-card .val { font-size:26px; font-weight:700; color:var(--primary-blue); margin:6px 0 2px; }
  .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:16px; }
  .chart-card { background:white; border-radius:10px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .chart-card h3 { color:#1e3a5f; font-size:var(--font-base); font-weight:600; margin-bottom:14px; }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="tab-bar">
    <button class="tab-btn active" id="tabAtual" onclick="switchTab('atual')">Leituras Atuais</button>
    <button class="tab-btn" id="tabHist" onclick="switchTab('hist')">Histórico Contínuo</button>
    <button class="tab-btn" id="tabGeral" onclick="switchTab('geral')">Balanço Diário (Geral)</button>
    <button class="tab-btn" id="tabDetalhe" onclick="switchTab('detalhe')">Balanço (Detalhe)</button>
  </div>

  <!-- ── ATUAL ── -->
  <div id="viewAtual">
    <div class="tbl-wrap">
      <div class="tbl-bar">
        <h2>📋 Leituras Atuais</h2>
        <div class="tbl-info"><span class="refresh-dot"></span>Atualiza 30s &nbsp;|&nbsp; <span id="lastUpdate">—</span></div>
      </div>
      <div id="tableContainer" style="padding:20px; overflow-x:auto;"><div class="loader"></div></div>
    </div>
  </div>

  <!-- ── HISTÓRICO ── -->
  <div id="viewHist" style="display:none">
    <div class="top-bar">
      <div>
        <label>Reservatório</label>
        <div class="alias-selector" id="aliasSelHist"></div>
      </div>
      <div>
        <label>Período</label>
        <select id="period">
          <option value="24h">Últimas 24h</option>
          <option value="7d">7 dias</option>
          <option value="30d">30 dias</option>
        </select>
      </div>
      <div>
        <label>Variável</label>
        <select id="varSel">
          <option value="pct">Nível %</option>
          <option value="volume_l">Volume (L)</option>
          <option value="level_cm">Nível cm</option>
        </select>
      </div>
      <button class="btn-primary" onclick="loadHist()">Carregar Histórico</button>
    </div>
    <div class="stats-row">
      <div class="stat-mini"><div class="slbl">Mínimo</div><div class="sval" id="hMin">—</div></div>
      <div class="stat-mini"><div class="slbl">Máximo</div><div class="sval" id="hMax">—</div></div>
      <div class="stat-mini"><div class="slbl">Média</div><div class="sval" id="hAvg">—</div></div>
      <div class="stat-mini"><div class="slbl">Atual</div><div class="sval" id="hCur">—</div></div>
      <div class="stat-mini"><div class="slbl">Leituras</div><div class="sval" id="hCnt">—</div></div>
    </div>
    <div class="chart-wrap">
      <h3 id="chartTitleHist">📈 Histórico Contínuo</h3>
      <canvas id="histChart" height="100"></canvas>
    </div>
  </div>

  <!-- ── BALANÇO: VISÃO GERAL ── -->
  <div id="viewGeral" style="display:none">
    <div class="top-bar">
      <div><label>Data de Referência</label><input type="date" id="dateGeral"></div>
      <button class="btn-primary" onclick="loadGeral()">Carregar Balanço Total</button>
      <span style="font-size:var(--font-xs);color:var(--text-muted);margin-bottom:6px" id="geralInfo"></span>
    </div>
    <div class="supply-grid" id="geralGrid">
      <div style="color:var(--text-muted);padding:40px;font-size:var(--font-base)">⏳ Carregando...</div>
    </div>
  </div>

  <!-- ── BALANÇO: DETALHE ── -->
  <div id="viewDetalhe" style="display:none">
    <div class="top-bar">
      <div><label>Data</label><input type="date" id="dateDetalhe"></div>
      <div>
        <label>Reservatório</label>
        <div class="alias-selector" id="aliasSelDet"></div>
      </div>
      <button class="btn-primary" onclick="loadDetalhe()">Analisar Específico</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="lbl">Consumido</div><div class="val" id="stConsumed">— L</div></div>
      <div class="stat-card"><div class="lbl">Abastecido</div><div class="val" id="stSupplied">— L</div></div>
      <div class="stat-card"><div class="lbl">Balanço (Net)</div><div class="val" id="stBalance">— L</div></div>
      <div class="stat-card"><div class="lbl">Eventos Encontrados</div><div class="val" id="stEvents">—</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>📉 Curva de Volume (24h Selecionadas)</h3>
        <canvas id="volChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <h3>📊 Detalhamento de Eventos (Abastecimento x Consumo)</h3>
        <canvas id="evtChart" height="120"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/chart.min.js"></script>
<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('dados.html');

let globalReservoirs = [];

function switchTab(tab) {
  ['Atual','Hist','Geral','Detalhe'].forEach(t => {
    document.getElementById('view'+t).style.display = t.toLowerCase() === tab ? '' : 'none';
    document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase() === tab);
  });
  if (tab === 'hist' && !selAliasHist) initSels();
  if (tab === 'detalhe' && !selAliasDet) initSels();
}

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function fmtHM(ts) {
  return new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtTs(ts) {
  const d = new Date(ts*1000);
  return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// ── INIT SECONDS ──
async function preloadData() {
  try {
    const raw = await aguadaAPI.getReservoirs();
    globalReservoirs = aguadaAPI.sortReservoirs(raw);
    renderAtual(globalReservoirs);
    setStatus(raw.some(r => r.online));
    initSels();
    loadGeral();
  } catch(e) { /* ignore here, will be caught by individual loaders */ }
}

// ── LEITURAS ATUAIS ──
function gc(pct) {
  if (pct <= 20) return '#ef4444';
  if (pct <= 35) return '#f59e0b';
  return '#10b981';
}

function renderAtual(data) {
  const c = document.getElementById('tableContainer');
  if (!data.length) { c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">Nenhum reservatório.</div>'; return; }
  const rows = data.map(r => {
    const pct = r.pct ?? 0, col = gc(pct);
    const vol = r.volume_l != null ? (r.volume_l/1000).toFixed(3)+' m³' : '—';
    const cap = r.volume_max_l != null ? (r.volume_max_l/1000).toFixed(1)+' m³' : (r.capacity_l != null ? (r.capacity_l/1000).toFixed(1)+' m³' : '—');
    const badge = r.online ? '<span class="badge-online">● Online</span>' : '<span class="badge-offline">● Offline</span>';
    return `<tr>
      <td><strong style="color:#1e3a5f;font-size:var(--font-base)">${r.alias}</strong></td>
      <td style="color:var(--text-muted)">${r.name || '—'}</td>
      <td>${badge}</td>
      <td><div style="display:flex;align-items:center">
        <div class="pct-bar"><div class="pct-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <span style="font-weight:600;color:${col}">${pct.toFixed(1)}%</span>
      </div></td>
      <td>${vol}</td><td style="color:var(--text-muted)">${cap}</td>
      <td>${r.level_cm != null ? r.level_cm.toFixed(1)+' cm' : '—'}</td>
      <td>${r.rssi != null ? r.rssi+' dBm' : '—'}</td>
      <td style="color:var(--text-muted)">${aguadaAPI.fmtTs(r.ts)}</td>
    </tr>`;
  }).join('');
  c.innerHTML = `<table><thead><tr>
    <th>Alias</th><th>Nome</th><th>Status</th><th>Nível %</th>
    <th>Volume</th><th>Capacidade</th><th>Nível cm</th><th>RSSI</th><th>Atualização</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('pt-BR');
}

aguadaAPI.connectWS(msg => {
  if (msg.type === 'snapshot') {
    const data = Array.isArray(msg.data) ? msg.data : (msg.data?.reservoirs||[]);
    if (data.length) {
       globalReservoirs = aguadaAPI.sortReservoirs(data);
       renderAtual(globalReservoirs);
       setStatus(data.some(r=>r.online));
    }
  }
});

// ── SELECTORS (HIST & DETALHE) ──
let selAliasHist = null, selAliasDet = null;

function initSels() {
  if (!globalReservoirs.length) return;
  const genBtns = (currAlias, prefix) => globalReservoirs.map((r,i) => 
    `<button class="alias-btn${(currAlias||globalReservoirs[0].alias)===r.alias?' active':''}" onclick="setSelAlias('${prefix}','${r.alias}',this)">${r.alias}</button>`
  ).join('');

  document.getElementById('aliasSelHist').innerHTML = genBtns(selAliasHist, 'Hist');
  document.getElementById('aliasSelDet').innerHTML = genBtns(selAliasDet, 'Det');
  if(!selAliasHist) selAliasHist = globalReservoirs[0].alias;
  if(!selAliasDet) selAliasDet = globalReservoirs[0].alias;
}
function setSelAlias(prefix, alias, btn) {
  if(prefix==='Hist') selAliasHist = alias;
  if(prefix==='Det') selAliasDet = alias;
  btn.parentElement.querySelectorAll('.alias-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── HISTÓRICO ──
let histChart = null;
async function loadHist() {
  if (!selAliasHist) return;
  const period = document.getElementById('period').value;
  const varKey = document.getElementById('varSel').value;
  const units  = { pct:'%', volume_l:'L', level_cm:'cm' };
  const labels = { pct:'Nível %', volume_l:'Volume (L)', level_cm:'Nível (cm)' };
  try {
    const history = await aguadaAPI.getHistory(selAliasHist, period);
    const vals = history.map(r => r[varKey]).filter(v => v != null);
    document.getElementById('hMin').textContent = vals.length ? Math.min(...vals).toFixed(1)+units[varKey] : '—';
    document.getElementById('hMax').textContent = vals.length ? Math.max(...vals).toFixed(1)+units[varKey] : '—';
    document.getElementById('hAvg').textContent = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+units[varKey] : '—';
    document.getElementById('hCur').textContent = vals.length ? vals[vals.length-1].toFixed(1)+units[varKey] : '—';
    document.getElementById('hCnt').textContent = history.length;
    document.getElementById('chartTitleHist').textContent = `📈 ${labels[varKey]} — ${selAliasHist} (${period})`;
    if (histChart) histChart.destroy();
    const step = Math.max(1, Math.floor(history.length/300));
    const pts  = history.filter((_,i)=>i%step===0);
    histChart = new Chart(document.getElementById('histChart'), {
      type:'line',
      data:{ labels: pts.map(r=>fmtTs(r.ts)), datasets:[{ label:labels[varKey], data:pts.map(r=>r[varKey]), borderColor:'#667eea', backgroundColor:'rgba(102,126,234,.08)', borderWidth:2, pointRadius:pts.length>300?0:2, tension:0.3, fill:true, spanGaps:true }] },
      options:{ responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{maxTicksLimit:12,font:{size:10}},grid:{display:false}}} }
    });
  } catch(e) { console.error(e); }
}

// ── BALANÇO GERAL ──
function bCardHTML(r, consumption, idx) {
  const s       = consumption?.summary || {};
  const events  = (consumption?.events||[]).filter(e => e.type==='supply');
  const consumed = s.consumed_l ?? 0;
  const supplied = s.supplied_l ?? 0;
  const balance  = s.balance_l  ?? 0;
  const evtRows  = events.slice(0,6).map(e => `<tr><td>${fmtHM(e.ts_start)}</td><td style="color:#065f46;font-weight:600">+${e.delta_l.toFixed(0)} L</td><td style="color:var(--text-muted)">${e.duration_min ? e.duration_min.toFixed(0)+'m' : '—'}</td></tr>`).join('');
  return `
    <div class="supply-card">
      <div class="supply-card-header rc-${idx%8}">💧 ${r.alias}${r.name ? ' — '+r.name : ''}</div>
      <div class="supply-card-body">
        <div class="supply-kpi">
          <div class="kpi"><div class="k-lbl">Consumido</div><div class="k-val" style="color:#ef4444">${consumed.toFixed(0)} L</div></div>
          <div class="kpi"><div class="k-lbl">Abastecido</div><div class="k-val" style="color:#10b981">${supplied.toFixed(0)} L</div></div>
          <div class="kpi"><div class="k-lbl">Balanço</div><div class="k-val" style="color:${balance>=0?'#10b981':'#ef4444'}">${balance>=0?'+':''}${balance.toFixed(0)} L</div></div>
        </div>
        <div>
          ${events.length
            ? `<table><thead><tr><th>Início</th><th>Entrada.</th><th>Duração</th></tr></thead><tbody>${evtRows}</tbody></table>
               ${events.length>6?`<div style="font-size:var(--font-xxs);color:var(--text-muted);margin-top:5px">+${events.length-6} outros eventos...</div>`:''}`
            : '<div class="no-data">Nenhum abastecimento detectado nesta data</div>'}
        </div>
      </div>
    </div>`;
}

async function loadGeral() {
  const date = document.getElementById('dateGeral').value;
  if (!date || !globalReservoirs.length) return;
  document.getElementById('geralInfo').textContent = 'Analisando balanço diário...';
  document.getElementById('geralGrid').innerHTML = '<div style="color:var(--text-muted);padding:20px;font-size:16px;">⏳ Coletando deltas de fornecimento e consumo...</div>';
  try {
    const results = await Promise.all(
      globalReservoirs.map(r => aguadaAPI.getConsumption(r.alias, date).catch(()=>null))
    );
    document.getElementById('geralGrid').innerHTML = globalReservoirs.map((r,i) => bCardHTML(r, results[i], i)).join('') || '<div style="color:var(--text-muted);padding:40px">Sem dados de balanço</div>';
    document.getElementById('geralInfo').textContent = `${globalReservoirs.length} unidades processadas com sucesso.`;
  } catch(e) {
    document.getElementById('geralGrid').innerHTML = `<div class="alert">Erro na agregação de balanço: ${e.message}</div>`;
  }
}

// ── BALANÇO DETALHE ──
let volChart = null, evtChart = null;

async function loadDetalhe() {
  const date = document.getElementById('dateDetalhe').value;
  if (!selAliasDet || !date) return;
  try {
    const res = await aguadaAPI.getConsumption(selAliasDet, date);
    const s   = res.summary || {};
    document.getElementById('stConsumed').textContent = s.consumed_l != null ? s.consumed_l.toFixed(0)+' L' : '— L';
    document.getElementById('stSupplied').textContent = s.supplied_l != null ? s.supplied_l.toFixed(0)+' L' : '— L';
    const bal = s.balance_l ?? 0;
    const balEl = document.getElementById('stBalance');
    balEl.textContent = (bal>=0?'+':'')+bal.toFixed(0)+' L';
    balEl.style.color = bal >= 0 ? '#10b981' : '#ef4444';
    document.getElementById('stEvents').textContent = (res.events||[]).length;

    const history   = await aguadaAPI.getHistory(selAliasDet, '24h');
    const todayTs   = new Date(date+'T00:00:00').getTime()/1000;
    const todayRows = history.filter(r => r.ts >= todayTs && r.ts < todayTs+86400);

    if (volChart) volChart.destroy();
    if (todayRows.length) {
      volChart = new Chart(document.getElementById('volChart'), {
        type:'line', data:{ labels: todayRows.map(r => fmtHM(r.ts)), datasets:[{ label:'Volume (L)', data:todayRows.map(r=>r.volume_l), borderColor:'#667eea', backgroundColor:'rgba(102,126,234,.1)', borderWidth:2, pointRadius:todayRows.length>200?0:2, tension:0.3, fill:true, spanGaps:true }] },
        options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}}}
      });
    }

    const events = (res.events||[]).filter(e=>e.type==='consumption'||e.type==='supply');
    if (evtChart) evtChart.destroy();
    if (events.length) {
      evtChart = new Chart(document.getElementById('evtChart'), {
        type:'bar', data:{ labels: events.map(e=>fmtHM(e.ts_start)), datasets:[{ label:'Volume (L)', data:events.map(e=>e.delta_l), backgroundColor: events.map(e=>e.type==='supply'?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)') }] },
        options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}}}
      });
    }
  } catch(e) { console.error(e); }
}

const today = aguadaAPI.today();
document.getElementById('dateGeral').value   = today;
document.getElementById('dateDetalhe').value = today;

preloadData();
