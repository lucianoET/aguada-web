<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Alertas</title>
<link rel="stylesheet" href="assets/aguada.css?v=2">
<link rel="stylesheet" href="assets/style.css">
<style>
  .alerts-layout { display:grid; grid-template-columns:1fr 300px; gap:16px; }
  @media(max-width:900px){ .alerts-layout{grid-template-columns:1fr} }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="alerts-layout">
    <div class="ha-card">
      <div class="ha-card-header">
        <span class="ha-card-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Alertas Ativos
        </span>
        <span id="alertCount" class="badge badge-blue">—</span>
      </div>
      <div class="ha-card-body" id="alertsList"><div class="loader"></div></div>
    </div>
    <div class="ha-card">
      <div class="ha-card-header">
        <span class="ha-card-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/>
          </svg>
          Resumo
        </span>
      </div>
      <div class="ha-card-body" id="summary"><div class="loader"></div></div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('alerts.html');

const THRESH = { crit: 20, warn: 35 };

function setStatus(online) {
  document.getElementById('statusDot').className    = 'status-dot '+(online?'online':'offline');
  document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
}

function generateAlerts(reservoirs) {
  const alerts = [];
  const now    = Date.now()/1000;
  reservoirs.forEach(r => {
    const pct  = r.pct ?? 0;
    const name = r.name ? `${r.alias} (${r.name})` : r.alias;
    if (!r.online) {
      const minsAgo = r.ts ? Math.round((now-r.ts)/60) : '?';
      alerts.push({ level:'crit',
        title:`CRÍTICO — ${name} sem comunicação`,
        body:`Último dado há ${minsAgo} minutos. Verifique o sensor e a alimentação.` });
    } else if (pct <= THRESH.crit) {
      alerts.push({ level:'crit',
        title:`CRÍTICO — ${name} com nível baixo`,
        body:`Nível: ${pct.toFixed(1)}% (limite crítico: ${THRESH.crit}%). Volume: ${r.volume_l!=null?(r.volume_l/1000).toFixed(2)+' m³':'—'}.` });
    } else if (pct <= THRESH.warn) {
      alerts.push({ level:'warn',
        title:`AVISO — ${name} com nível reduzido`,
        body:`Nível: ${pct.toFixed(1)}% (limite: ${THRESH.warn}%). Considere acionar abastecimento.` });
    }
    if (r.out_of_range) {
      alerts.push({ level:'warn',
        title:`AVISO — ${name} com leitura fora do alcance`,
        body:`Sensor reportou distância inválida. Verifique obstrução ou posicionamento.` });
    }
  });
  if (!alerts.length)
    alerts.push({ level:'ok',
      title:'Todos os reservatórios em condições normais',
      body:`${reservoirs.filter(r=>r.online).length} de ${reservoirs.length} sensores online. Níveis dentro dos limites.` });
  return alerts;
}

function render(raw) {
  const reservoirs = aguadaAPI.sortReservoirs(raw);
  const alerts  = generateAlerts(reservoirs);
  const crits   = alerts.filter(a=>a.level==='crit').length;
  const warns   = alerts.filter(a=>a.level==='warn').length;
  const active  = crits + warns;

  const cntEl = document.getElementById('alertCount');
  cntEl.textContent = active;
  cntEl.className   = `badge ${crits>0?'badge-red':warns>0?'badge-yellow':'badge-green'}`;

  document.getElementById('alertsList').innerHTML = alerts.map(a => `
    <div class="ha-alert ha-alert-${a.level}">
      <strong>${a.title}</strong>
      ${a.body}
      <div class="ha-alert-meta">Verificado: ${new Date().toLocaleString('pt-BR')}</div>
    </div>`).join('');

  document.getElementById('summary').innerHTML = `
    <div class="ha-entities">
      <div class="ha-entity-row"><span class="ha-entity-name">Críticos</span><span class="badge badge-red">${crits}</span></div>
      <div class="ha-entity-row"><span class="ha-entity-name">Avisos</span><span class="badge badge-yellow">${warns}</span></div>
      <div class="ha-entity-row"><span class="ha-entity-name">Normais</span><span class="badge badge-green">${reservoirs.filter(r=>r.online&&(r.pct??0)>THRESH.warn).length}</span></div>
      <div class="ha-entity-row"><span class="ha-entity-name">Online</span><span class="badge badge-blue">${reservoirs.filter(r=>r.online).length}/${reservoirs.length}</span></div>
      <div class="ha-entity-row"><span class="ha-entity-name" style="font-size:var(--font-xs);color:var(--text3)">Última verificação: ${new Date().toLocaleTimeString('pt-BR')}</span></div>
    </div>`;
}

let reservoirs = [];
async function load() {
  try {
    reservoirs = await aguadaAPI.getReservoirs();
    setStatus(reservoirs.some(r=>r.online));
    render(reservoirs);
  } catch(e) {
    setStatus(false);
    document.getElementById('alertsList').innerHTML = `<div class="ha-alert ha-alert-crit">Erro: ${e.message}</div>`;
  }
}

aguadaAPI.connectWS(msg => {
  if (msg.type==='snapshot') {
    const data = Array.isArray(msg.data)?msg.data:(msg.data?.reservoirs||[]);
    if (data.length) { reservoirs=data; render(data); setStatus(data.some(r=>r.online)); }
  }
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
