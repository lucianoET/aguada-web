<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AGUADA — Alertas</title>
<link rel="stylesheet" href="assets/aguada.css?v=3">
<link rel="stylesheet" href="assets/style.css">
<style>
  .alerts-layout { display:grid; grid-template-columns:1fr 300px; gap:16px; }
  @media(max-width:900px){ .alerts-layout{grid-template-columns:1fr} }
  .alert-item { padding:11px 14px; border-radius:8px; margin-bottom:10px; font-size:var(--font-sm); border-left:4px solid; display:flex; gap:12px; align-items:flex-start; }
  .alert-item .txt { flex:1; min-width:0; }
  .alert-crit { background:#fef2f2; border-color:#ef4444; color:#991b1b; }
  .alert-warn { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
  .alert-ok   { background:#f0fdf4; border-color:#10b981; color:#065f46; }
  [data-theme="dark"] .alert-crit { background:rgba(239,68,68,.12); color:#fca5a5; }
  [data-theme="dark"] .alert-warn { background:rgba(245,158,11,.12); color:#fcd34d; }
  [data-theme="dark"] .alert-ok   { background:rgba(16,185,129,.12); color:#6ee7b7; }
  .alert-item strong { display:block; margin-bottom:3px; font-size:var(--font-base); overflow-wrap:anywhere; }
  .alert-meta { font-size:var(--font-xxs); opacity:.8; margin-top:4px; }
  .ack-btn { flex:none; padding:6px 12px; border-radius:6px; border:1px solid currentColor; background:transparent; color:inherit; font-weight:700; font-size:12px; cursor:pointer; }
  .ack-btn:hover:not(:disabled) { background:rgba(0,0,0,.06); }
  .ack-btn:disabled { opacity:.5; cursor:wait; }
  .acked { flex:none; font-size:11px; opacity:.85; text-align:right; }
  .sum-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-color, var(--border)); font-size:var(--font-sm); }
  .sum-row:last-child { border-bottom:none; }
  .abadge { padding:3px 10px; border-radius:8px; font-size:var(--font-xxs); font-weight:600; display:inline-block; white-space:nowrap; }
  .abadge-crit { background:#fee2e2; color:#991b1b; }
  .abadge-warn { background:#fef3c7; color:#92400e; }
  .abadge-ok   { background:#d1fae5; color:#065f46; }
  .abadge-info { background:#eff6ff; color:#1e40af; }
  .sum-lbl { display:inline-flex; align-items:center; gap:8px; }
  .sdot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .operator { display:flex; flex-direction:column; gap:4px; padding-bottom:10px; margin-bottom:6px; border-bottom:1px solid var(--border); font-size:var(--font-xs); color:var(--text2); }
  .operator input { padding:7px 9px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; font-size:13px; }
  .operator input.missing { border-color:#ef4444; box-shadow:0 0 0 2px rgba(239,68,68,.2); }
  .hist-tools { display:flex; gap:8px; align-items:center; }
  .hist-tools select { padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; font-size:12px; }
  .hist-wrap { overflow-x:auto; }
  table.hist { width:100%; border-collapse:collapse; font-size:12px; }
  table.hist th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text2); padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.hist td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.hist td.ts { font-family:var(--mono); white-space:nowrap; }
  table.hist td.desc { min-width:260px; }
  .limits { font-size:var(--font-xxs); color:var(--text2); line-height:1.4; margin-top:8px; }
</style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<div class="admin-main">
  <div class="alerts-layout">
    <div class="box">
      <div class="box-header">
        <h2>Alarmes ativos</h2>
        <span id="alertCount" class="abadge abadge-info">—</span>
      </div>
      <div class="box-body" id="alertsList"><div class="loader"></div></div>
    </div>
    <div class="box">
      <div class="box-header"><h2>Resumo</h2></div>
      <div class="box-body">
        <label class="operator">Operador (registrado no reconhecimento)
          <input id="operator" type="text" autocomplete="name" placeholder="Seu nome ou posto" maxlength="60">
        </label>
        <div id="summary"><div class="loader"></div></div>
        <p class="limits">Nível: crítico ≤ 20 %, baixo ≤ 35 %, alto ≥ 98 %. Só normaliza 3 pontos além do limite (histerese, Normas §3.4). Sensor sem leitura há 10 min = falha. Salto &gt; 50 cm em 5 min fica no histórico como leitura suspeita.</p>
      </div>
    </div>
  </div>

  <div class="box" style="margin-top:16px">
    <div class="box-header">
      <h2>Histórico de eventos</h2>
      <div class="hist-tools">
        <select id="histFilter" aria-label="Filtrar por tipo">
          <option value="">Todos</option>
          <option value="alarme">Alarmes</option>
          <option value="falha">Falhas</option>
          <option value="comando">Comandos</option>
          <option value="informativo">Informativos</option>
        </select>
      </div>
    </div>
    <div class="box-body hist-wrap" id="history"><div class="loader"></div></div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('alerts.html');

const OP_KEY = 'aguada.operador';
const opInput = document.getElementById('operator');
try { opInput.value = localStorage.getItem(OP_KEY) || ''; } catch {}
opInput.addEventListener('input', () => {
  opInput.classList.remove('missing');
  try { localStorage.setItem(OP_KEY, opInput.value.trim()); } catch {}
});

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${Math.floor(m / 1440)} dias`;
}
const sevClass = (sev) => sev === 'critico' ? 'crit' : sev === 'alerta' ? 'warn' : 'ok';
const TIPO = { alarme:'Alarme', falha:'Falha', comando:'Comando', informativo:'Informativo' };
const SEV = { critico:'Crítico', alerta:'Alerta', info:'Info' };
const ENT = { reservatorio:'reservatório', valvula:'válvula', hidrometro:'hidrômetro' };

let active = [], events = [], reservoirs = [];

function renderActive() {
  const crit = active.filter((a) => a.severidade === 'critico').length;
  const warn = active.length - crit;
  const pend = active.filter((a) => !a.ack_ts).length;
  const cnt = document.getElementById('alertCount');
  cnt.textContent = active.length;
  cnt.className = `abadge ${crit ? 'abadge-crit' : warn ? 'abadge-warn' : 'abadge-ok'}`;

  document.getElementById('alertsList').innerHTML = active.length ? active.map((a) => `
    <div class="alert-item alert-${sevClass(a.severidade)}">
      <div class="txt">
        <strong>${esc(a.descricao)}</strong>
        ${TIPO[a.tipo]} · ${esc(ENT[a.entidade] || a.entidade)} ${esc(a.entidade_id)}
        <div class="alert-meta">Desde ${fmt(a.ts)} (há ${ago(a.ts)})</div>
      </div>
      ${a.ack_ts
        ? `<div class="acked">Reconhecido por<br><b>${esc(a.ack_usuario)}</b><br>${fmt(a.ack_ts)}</div>`
        : `<button class="ack-btn" type="button" onclick="ack(${a.id}, this)">Reconhecer</button>`}
    </div>`).join('')
    : `<div class="alert-item alert-ok"><div class="txt"><strong>Nenhum alarme ativo</strong>
        ${reservoirs.filter((r) => r.online).length} de ${reservoirs.length} sensores comunicando.</div></div>`;

  document.getElementById('summary').innerHTML = `
    <div class="sum-row"><span class="sum-lbl"><i class="sdot" style="background:var(--red)"></i>Críticos</span><span class="abadge abadge-crit">${crit}</span></div>
    <div class="sum-row"><span class="sum-lbl"><i class="sdot" style="background:var(--yellow)"></i>Alertas</span><span class="abadge abadge-warn">${warn}</span></div>
    <div class="sum-row"><span class="sum-lbl"><i class="sdot" style="background:var(--blue)"></i>Não reconhecidos</span><span class="abadge abadge-info">${pend}</span></div>
    <div class="sum-row"><span class="sum-lbl"><i class="sdot" style="background:var(--green)"></i>Sensores online</span><span class="abadge abadge-ok">${reservoirs.filter((r) => r.online).length}/${reservoirs.length}</span></div>`;
}

function renderHistory() {
  const f = document.getElementById('histFilter').value;
  const rows = events.filter((e) => !f || e.tipo === f);
  document.getElementById('history').innerHTML = rows.length ? `
    <table class="hist">
      <thead><tr><th>Data/hora</th><th>Tipo</th><th>Severidade</th><th>Entidade</th><th>Descrição</th><th>Quem</th></tr></thead>
      <tbody>${rows.map((e) => `<tr>
        <td class="ts">${fmt(e.ts)}</td>
        <td>${TIPO[e.tipo] || esc(e.tipo)}</td>
        <td><span class="abadge abadge-${sevClass(e.severidade) === 'ok' ? 'info' : sevClass(e.severidade)}">${SEV[e.severidade] || esc(e.severidade)}</span></td>
        <td>${esc(e.entidade_id)}</td>
        <td class="desc">${esc(e.descricao)}${e.normalizado_ts ? `<br><small style="color:var(--text2)">normalizado ${fmt(e.normalizado_ts)}</small>` : ''}</td>
        <td>${esc(e.usuario || '')}${e.ack_usuario ? `${e.usuario ? '<br>' : ''}<small style="color:var(--text2)">visto: ${esc(e.ack_usuario)}</small>` : ''}</td>
      </tr>`).join('')}</tbody>
    </table>` : '<p style="color:var(--text2);font-size:13px">Nenhum evento registrado.</p>';
}

async function ack(id, btn) {
  const usuario = opInput.value.trim();
  if (!usuario) { opInput.classList.add('missing'); opInput.focus(); return; }
  btn.disabled = true;
  const r = await fetch(`/api/events/${id}/ack`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ usuario }) }).catch(() => null);
  if (!r?.ok) { btn.disabled = false; btn.textContent = 'Falhou, tentar de novo'; return; }
  await load();
}

async function load() {
  try {
    const [a, e, r] = await Promise.all([
      fetch('/api/events/active').then((x) => x.json()),
      fetch('/api/events?limit=300').then((x) => x.json()),
      aguadaAPI.getReservoirs().catch(() => []),
    ]);
    active = a.items || []; events = e.items || []; reservoirs = Array.isArray(r) ? r : [];
    renderActive(); renderHistory();
  } catch (err) {
    document.getElementById('alertsList').innerHTML = `<div class="alert-item alert-crit"><div class="txt"><strong>Não foi possível carregar os alarmes</strong>${esc(err.message)}</div></div>`;
  }
}

document.getElementById('histFilter').addEventListener('change', renderHistory);
// evento novo (alarme, normalização, comando, reconhecimento) chega pelo WebSocket
aguadaAPI.connectWS((msg) => { if (msg.type === 'event') load(); });
setInterval(() => renderActive(), 60000);  // atualiza o "há X min"
load();
</script>
</body>
</html>
