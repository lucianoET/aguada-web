<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:,">
  <title>AGUADA — Planta</title>
  <link rel="stylesheet" href="assets/aguada.css?v=3"/>
  <link rel="stylesheet" href="assets/style.css"/>
  <link rel="stylesheet" href="assets/vendor/leaflet.min.css"/>
  <link rel="stylesheet" href="assets/mapa.css"/>
  <style>
    [x-cloak] { display: none; }
    body.admin-page { background: var(--bg); }
    #planta-map { height: calc(100dvh - 48px); background: #aad3df; }

    /* Painel de camadas sobre o mapa */
    .legend {
      position: absolute; left: 12px; bottom: 24px; z-index: 900;
      width: 250px; max-height: calc(100dvh - 120px); overflow-y: auto;
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      font: 13px/1.3 Arial, sans-serif;
    }
    .legend summary {
      cursor: pointer; padding: 10px 14px; font-weight: 700; font-size: 12px;
      letter-spacing: .06em; text-transform: uppercase; list-style: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .legend summary::after { content: '▾'; color: var(--text2); }
    .legend:not([open]) summary::after { content: '▸'; }
    .legend-group { padding: 4px 14px 10px; border-top: 1px solid var(--border); }
    .legend-group h3 { margin: 8px 0 4px; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
    .legend label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .legend input { accent-color: #2563eb; width: 15px; height: 15px; margin: 0; flex: none; }
    .legend .sw { width: 22px; height: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
    .legend .line { width: 22px; height: 0; border-top: 3px solid; }
    .legend .hint { font-size: 11px; color: var(--text2); margin: 2px 0 0 23px; }
    .legend .note { font-size: 11px; color: var(--text2); padding: 0 14px 12px; }

    @media (max-width: 640px) {
      .legend { left: 8px; right: 8px; bottom: 16px; width: auto; max-height: 55dvh; }
    }
  </style>
</head>
<body class="admin-page">
<div id="topbar" class="admin-header"></div>

<main x-data="plantaApp()" style="position:relative">  <!-- Alpine chama init() sozinho -->
  <div id="planta-map" role="application" aria-label="Planta da rede hidráulica"></div>

  <details class="legend" x-ref="legend" open x-cloak>
    <summary>Camadas</summary>

    <div class="legend-group">
      <h3>Redes e planta</h3>
      <template x-for="o in overlayList" :key="o.key">
        <label>
          <input type="checkbox" :checked="layers[o.key]" @change="toggleLayer(o.key)"/>
          <span class="sw"><span class="line" :style="`border-color:${o.color}` + (o.key === 'areas' ? ';border-top-style:dashed' : '')"></span></span>
          <span x-text="o.label"></span>
        </label>
      </template>
    </div>

    <div class="legend-group">
      <h3>Elementos</h3>
      <label><input type="checkbox" x-model="filters.reservoirs" @change="sync()"/>
        <span class="sw"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="12" height="14" rx="2" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="3" y="7" width="8" height="6" fill="#22c55e"/></svg></span>
        Reservatórios</label>
      <label><input type="checkbox" x-model="filters.pumps" @change="sync()"/>
        <span class="sw"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M5.5 5 L11.5 8 L5.5 11 Z" fill="#64748b"/></svg></span>
        Bombas</label>
      <label><input type="checkbox" x-model="filters.valves" @change="sync()"/>
        <span class="sw"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 1 V13 L15 1 V13 Z" fill="#16a34a" stroke="#0b1626" stroke-width="1"/></svg></span>
        Válvulas</label>
      <div class="hint" x-show="filters.valves && zoom < 18">aproxime o mapa para ver</div>
      <label><input type="checkbox" x-model="filters.hydrometers" @change="sync()"/>
        <span class="sw"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="#0f766e" stroke-width="2"/></svg></span>
        Hidrômetros</label>
      <div class="hint" x-show="filters.hydrometers && zoom < 18">aproxime o mapa para ver</div>
      <label><input type="checkbox" x-model="filters.sanitation" @change="sync()"/>
        <span class="sw"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="3" fill="#8b5cf6"/></svg></span>
        ETE, caixa de gordura, fossas</label>
    </div>

    <div class="note">Redes, prédios e áreas vêm do projeto “Rede de incêndio e aguada” (as built). Clique num elemento para ver o estado.</div>
  </details>
</main>

<script src="assets/api.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/vendor/leaflet.min.js"></script>
<script src="assets/mapa.js"></script>
<script defer src="assets/vendor/alpine.min.js"></script>
<script>
document.getElementById('topbar').innerHTML = aguadaAPI.navHTML('planta.html');

function plantaApp() {
  return {
    ...wsMixin(),
    overlayList: aguadaMapa.OVERLAYS,
    layers: { adutora:true, agua:true, incendio:true, predios:true, areas:true },
    filters: { reservoirs:true, pumps:true, valves:true, hydrometers:true, sanitation:true },
    zoom: 17,
    data: { reservoirs:[], pumps:[], valves:[], hydrometers:[], infra:null },

    async init() {
      if (window.innerWidth < 640) this.$refs.legend.open = false;
      const [reservoirs, equip, hid, infra] = await Promise.all([
        aguadaAPI.getReservoirs().catch(() => []),
        aguadaAPI.getEquipCurrent().catch(() => ({ pumps:[], valves:[] })),
        aguadaAPI.getManualHydrometers(200).catch(() => ({ items:[] })),
        fetch('assets/infra.json').then((r) => r.json()).catch(() => null),
      ]);
      // Sem registro manual: equipamento do infra.json sem estado (cinza), nunca estado inventado
      this.data = {
        infra,
        reservoirs:Array.isArray(reservoirs) ? reservoirs : [],
        pumps:equip.pumps?.length ? equip.pumps : (infra?.pumps || []).map((p) => ({ pump_name:p.name, state:null })),
        valves:equip.valves?.length ? equip.valves : [],
        hydrometers:hid.items || [],
      };
      // Mapa e marcadores fora do proxy reativo do Alpine (Leaflet não gosta de ser observado)
      const { map, overlays } = await aguadaMapa.createMap('planta-map', {
        infra, control:false, on:Object.keys(this.layers), zoomControl:true,
      });
      this._m = () => ({ map, overlays });
      const markers = {};
      this._markers = () => markers;
      map.on('zoomend', () => { this.zoom = map.getZoom(); this.sync(); });
      this.sync();

      this.wsConnect((raw) => {
        const msg = normalizeWsMessage(raw);
        if (msg.type === 'snapshot') this.data.reservoirs = msg.reservoirs;
        else if (msg.type === 'reading' && msg.reading) {
          const i = this.data.reservoirs.findIndex((r) => r.alias === msg.reading.alias);
          if (i >= 0) this.data.reservoirs[i] = { ...this.data.reservoirs[i], ...msg.reading };
          else this.data.reservoirs.push(msg.reading);
        }
        this.sync();
      });
    },

    toggleLayer(key) {
      this.layers[key] = !this.layers[key];
      const { map, overlays } = this._m();
      if (this.layers[key]) overlays[key]?.addTo(map); else overlays[key]?.remove();
    },

    visible(type) {
      if (type === 'res') return this.filters.reservoirs;
      if (type === 'pump') return this.filters.pumps;
      if (type === 'valve') return this.filters.valves;
      if (type === 'hydrometer') return this.filters.hydrometers;
      return this.filters.sanitation;
    },

    sync() {
      if (!this._m) return;
      const { map } = this._m();
      const elements = aguadaMapa.buildElements(this.data, map.getZoom(), (type) => this.visible(type));
      aguadaMapa.syncMarkers(map, this._markers(), elements, (marker, item) => marker.bindPopup(() => this.popup(item)));
    },

    // Conteúdo calculado na abertura: mostra o estado atual, não o da criação do marcador
    popup(item) {
      if (item.type !== 'res') return item.summary?.detail || `<b>${item.name}</b>`;
      const site = aguadaMapa.buildElements(this.data, 19).find((e) => e.key === item.key) || item;
      return (site.tanks || [site]).map((t) => {
        const vol = Number.isFinite(Number(t.volume_l)) ? `${(t.volume_l / 1000).toFixed(1)} m³` : '—';
        const pct = t.pct != null ? `${Math.round(t.pct)}%` : '—';
        return `<b>${t.name || t.alias}</b> (${t.alias})<br>${pct} · ${vol}<br>${t.online ? 'online' : 'offline'} · ${t.ts ? timeAgo(t.ts) : 'sem leitura'}`;
      }).join('<hr style="border:0;border-top:1px solid #e2e8f0;margin:6px 0">');
    },
  };
}
</script>
</body>
</html>
