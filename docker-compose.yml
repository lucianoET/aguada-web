services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - DATA_DIR=/data
      - GATEWAY_TRANSPORT=wifi
      - GW_MQTT_HOST=mqtt
      - GW_MQTT_PORT=1883
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
