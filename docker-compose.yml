services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
      # reservoirs.yaml do firmware; o backend recarrega quando muda (edição manual / sync).
      # Pasta, não arquivo: bind de arquivo fica preso no inode antigo. No Docker Desktop
      # nem a pasta vê o os.replace do bridge HA — offsets do HA chegam via MQTT .../config.
      - ${RESERVOIRS_DIR:-../platformio/tools}:/reservoirs:ro
    env_file:
      - .env
      # GW_MQTT_HOST/PORT/USER/PASS do broker onde o bridge HA publica (aguada/gateway/rx).
      # Sem o arquivo, o gateway é lido do mosquitto local (MQTT_HOST abaixo).
      - path: .env.gateway
        required: false
    environment:
      - DATA_DIR=/data
      - RESERVOIRS_FILE=/reservoirs/reservoirs.yaml
      - GATEWAY_TRANSPORT=wifi
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
