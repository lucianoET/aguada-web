# docker-compose.wifi.yml
# Stack completa para produção com gateway WiFi (sem serial).
#
# Uso:
#   docker compose -f docker-compose.wifi.yml up -d
#
# Variáveis (arquivo .env na mesma pasta):
#   HTTP_PORT   porta pública do nginx   (padrão: 80)
#   DATA_DIR    não é usado aqui; dados ficam no volume "aguada-data"
#   TZ          fuso horário             (padrão: America/Sao_Paulo)

services:

  # ── Broker MQTT ────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"          # expõe na LAN para o firmware do gateway
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - aguada-net

  # ── Backend FastAPI + bridge WiFi ──────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      - DATA_DIR=/data
      - GATEWAY_TRANSPORT=wifi
      - GW_MQTT_HOST=mqtt
      - GW_MQTT_PORT=1883
      - MQTT_HOST=mqtt          # publicação de leituras no mesmo broker (opcional)
      - MQTT_PORT=1883
      - TZ=${TZ:-America/Sao_Paulo}
    env_file:
      - path: .env
        required: false         # .env é opcional; variáveis acima têm precedência
    volumes:
      - aguada-data:/data
    networks:
      - aguada-net

  # ── Frontend nginx ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aguada-net

volumes:
  aguada-data:          # persiste SQLite e PDFs dentro do Docker

networks:
  aguada-net:
